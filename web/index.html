<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- resolve relative assets (scripts, icons) from root on nested content URLs (/blog/…, /…-printing-city/) -->
<base href="/">
<link rel="sitemap" type="application/xml" href="/sitemap.xml">
<link rel="icon" href="/assets/icons/cropped-favicon-32x32.png" sizes="32x32">
<link rel="icon" href="/assets/icons/cropped-favicon-192x192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/icons/cropped-favicon-180x180.png">
<meta name="theme-color" content="#E52220">
<title>Printoka — Online Printing in Malaysia, Singapore &amp; Brunei</title>
<meta name="description" content="Order business cards, flyers, stickers, packaging and more online. Instant pricing, member discounts up to 15%, and nationwide delivery across Malaysia, Singapore and Brunei.">
<!-- Static Open Graph / Twitter fallbacks; applySEO() refines these per route at runtime -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Printoka">
<meta property="og:title" content="Printoka — Online Printing in Malaysia, Singapore & Brunei">
<meta property="og:description" content="Order business cards, flyers, stickers, packaging and more online. Instant pricing and nationwide delivery.">
<meta property="og:image" content="/assets/products/business-card.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/assets/products/business-card.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* (user, 2026-09-30) one title style everywhere: a short red bar above every page title (heroes opt out) */
  h1:not(.pk-nobar)::before{content:"";display:block;width:24px;height:3px;background:#E52220;margin:0 0 12px}
  h1.pk-bar-c::before{margin:0 auto 12px}
  body{margin:0;background:#fff;color:#212121;font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  a{color:#14568a;text-decoration:none}
  .pk-toast{animation:pkToastIn .4s cubic-bezier(.215,.61,.355,1)}
  @keyframes pkToastIn{from{opacity:0;transform:translate(-50%,-24px)}to{opacity:1;transform:translate(-50%,0)}}
  .ac-hint::placeholder{color:#b8b8b8;font-weight:400;line-height:1.6}
  a:hover{color:#0e3f66}
  ::selection{background:#E5222026}
  [data-go]{cursor:pointer}
  /* configurator dropdown control: subtle hover so the collapsed (borderless) row still reads as clickable */
  .pk-ddctl{transition:background .12s}
  .pk-ddctl:hover{background:#f6f7f8}
  button:focus-visible,[data-go]:focus-visible,[role=button]:focus-visible,[role=option]:focus-visible,[role=combobox]:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #E52220;outline-offset:2px}
  /* skip-to-content link: off-screen until keyboard-focused */
  .pk-skip{position:absolute;left:-9999px;top:8px;z-index:200;background:#E52220;color:#fff;padding:9px 15px;border-radius:0;font-weight:600;text-decoration:none}
  .pk-skip:focus{left:8px}
  @keyframes pkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pkShine{0%{transform:translateX(0) skewX(-18deg)}60%,100%{transform:translateX(240px) skewX(-18deg)}}
  .pkfloat{animation:pkFloat 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .pkshine{animation:pkShine 5s ease-in-out infinite}
  /* configurator: the open question pops out, its options slide in */
  @keyframes pkPop{0%{transform:translateY(8px) scale(.975);box-shadow:0 0 0 rgba(33,33,33,0)}60%{transform:translateY(-2px) scale(1.004)}100%{transform:none}}
  @keyframes pkFlip{from{opacity:0;transform:perspective(1400px) rotateY(-12deg) translateX(22px)}to{opacity:1;transform:none}}
  @keyframes pkFlipBack{from{opacity:0;transform:perspective(1400px) rotateY(12deg) translateX(-22px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){[style*="pkFlip"]{animation:none!important}}
  @keyframes pkReveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.pkfloat,.pkshine{animation:none!important}.pk-q-open,.pk-q-open *{animation:none!important}}
  .pk-staffnav{scrollbar-width:none}.pk-staffnav::-webkit-scrollbar{display:none}
  .pk-ping{position:relative}.pk-ping::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:pkPing 1.4s cubic-bezier(0,0,.2,1) infinite}
  @keyframes pkPing{75%,100%{transform:scale(2.4);opacity:0}}
  /* blog articles (the original printoka.com posts): one typography for every article */
.pk-prose{font-size:15.5px;line-height:1.8;color:#2b2b2b}.pk-prose p{margin:0 0 16px}.pk-prose h2{font-size:23px;font-weight:600;line-height:1.3;margin:34px 0 12px;letter-spacing:-.01em;color:#111}.pk-prose h3{font-size:19px;font-weight:600;margin:26px 0 10px;color:#111}.pk-prose h4{font-size:16px;font-weight:600;margin:20px 0 8px}
.pk-prose img{max-width:100%;height:auto;display:block;margin:18px auto;border-radius:0}.pk-prose a{color:#E52220;font-weight:500;text-decoration:none}.pk-prose a:hover{text-decoration:underline}.pk-prose ul,.pk-prose ol{margin:0 0 16px;padding-left:22px}.pk-prose li{margin:6px 0}
.pk-prose strong{font-weight:600;color:#111}.pk-prose table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px}.pk-prose td,.pk-prose th{border:1px solid #eaeaea;padding:9px 11px;text-align:left}.pk-prose blockquote{margin:18px 0;padding:12px 18px;border-left:3px solid #E52220;background:#fdf2f2;border-radius:0}.pk-prose figure{margin:18px 0}
.pk-acc summary::-webkit-details-marker{display:none}.pk-acc:not([open]) .pk-acc-chev{transform:rotate(-90deg)}.pk-acc-chev{transition:transform .2s}
  .pk-mobilebar{display:none}
  /* configurator: summary column stacks under the questions on tablets / phones */
  @media(max-width:760px){.pk-cfgb-img{height:130px!important}.pk-cfgb-lg{font-size:30px!important}.pk-cfgb-sm{font-size:20px!important}.pk-cfgb-md{font-size:22px!important}}
  @media(max-width:900px){.pk-cfg-grid{grid-template-columns:minmax(0,1fr)!important}.pk-cfg-grid>*{position:static!important}}
  @media(max-width:760px){
    [data-shell]{grid-template-columns:1fr!important}
    [data-shell]>aside{position:static!important;display:flex;flex-wrap:wrap;gap:4px}
    [data-shell]>aside>div{flex:0 0 auto}
    .pk-mobilebar{display:flex}
    .pk-hide-sm{display:none!important}
    body{padding-bottom:64px}
  }
  @media (max-width:640px){ .pk-trust-item{ border-left:none !important; padding:0 18px 0 0 !important; } }
  .pk-board{position:relative;display:flex;align-items:center;justify-content:center;height:100%;min-height:236px;box-sizing:border-box;padding:18px 26px;background:#fff;border-radius:12px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 14px 34px rgba(0,0,0,.20),0 2px 6px rgba(0,0,0,.10)}.pk-board::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:10px;border-radius:0 0 12px 12px;box-shadow:0 6px 10px -6px rgba(0,0,0,.25);pointer-events:none}.pk-board img{display:block;height:200px;width:auto;max-width:100%;filter:none!important}
  .pk-paper-col{align-self:stretch;margin:-30px 0}
  @media(max-width:760px){.pk-board img{height:140px}.pk-board{min-height:0}.pk-paper-col{margin:-30px 0 0;width:100%}}
</style>
<script>
  // Asset resolver — falls back to the literal path, which is served from /assets.
  window.__asset = function (p) { return p; };
</script>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<!-- Storefront catalogue: display-name overrides + categories (display-only, over the engine) -->
<script src="catalogue.js"></script>
<script src="product-images.js"></script>
<script src="runtime.js"></script>
<script src="app.js"></script>
<script src="ops.js"></script>
<script src="admin.js"></script>
<script src="docs.js"></script>
<script src="account.js"></script>
<script src="jobs.js"></script>
<script src="production.js"></script>
<script src="storage.js"></script>
<script>
  // Render the app immediately (React + app.js are small), THEN load the ~20MB pricing
  // engine in the background so it never blocks first paint / LCP. The app is null-safe
  // without window.PricingEngine (prices fill in once it loads and fires pk-engine-ready).
  ReactDOM.createRoot(document.getElementById('root'))
    .render(React.createElement(window.PKComponent, window.PKProps));
  (function () {
    var s = document.createElement('script');
    s.src = 'pricing/engine.js';
    s.async = true;
    s.onload = function () { try { window.dispatchEvent(new Event('pk-engine-ready')); } catch (e) {} };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
